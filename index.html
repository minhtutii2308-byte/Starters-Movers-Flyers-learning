<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YLE Video Words</title>
<meta name="theme-color" content="#2B9A57">
<meta name="description" content="Học từ vựng Cambridge YLE Starters, Movers, Flyers: thẻ từ, Nghe, Đọc, Nói, Viết, trò chuyện và bài tập về nhà.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Grandstander:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap">
<script src="config.js"></script>
<style>
body{margin:0}

/* Layout: one-column app shell like an exercise notebook, sticky top bar, tab bar fixed at the bottom; each level owns a colour */
:root{
  --paper:#F1F6F2; --card:#FFFFFF; --ink:#1E2A25; --muted:#5B6962; --line:#D6E1D9;
  --starters:#2B9A57; --movers:#2C7CCB; --flyers:#D9741A; --sun:#F2B52A; --sun-ink:#5A3D00;
  --good:#2B9A57; --bad:#D04545; --soft:#E6EFE8; --shadow:0 2px 0 rgba(30,42,37,.08);
  --f-display:"Grandstander","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --f-meme:"Anton",Impact,"Arial Black",sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --lv:var(--starters);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131B17; --card:#1C2621; --ink:#E7EEE9; --muted:#9BA9A1; --line:#2D3A33;
  --starters:#4CC27D; --movers:#5BA3EF; --flyers:#F29B48; --sun:#F6C64F; --sun-ink:#2A1D00;
  --good:#4CC27D; --bad:#F06B6B; --soft:#24302A; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131B17; --card:#1C2621; --ink:#E7EEE9; --muted:#9BA9A1; --line:#2D3A33;
  --starters:#4CC27D; --movers:#5BA3EF; --flyers:#F29B48; --sun:#F6C64F; --sun-ink:#2A1D00;
  --good:#4CC27D; --bad:#F06B6B; --soft:#24302A; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.2px;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section{margin-top:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:600;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--lv);border-color:var(--lv);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--lv) 60%,#000)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{font-size:18px;padding:14px 20px}
/* home */
.pet{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pet .face{font-size:64px;line-height:1;width:96px;height:96px;display:grid;place-items:center;border-radius:28px;background:var(--soft);border:2px dashed var(--line)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.levels{grid-template-columns:1fr}}
.lvcard{text-align:left;border:2px solid var(--lc);border-radius:18px;padding:14px;background:var(--card);box-shadow:0 4px 0 var(--lc);display:flex;flex-direction:column;gap:4px}
.lvcard b{font-family:var(--f-display);font-size:22px;color:var(--lc)}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* tabs */
.seg{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--lv);color:#fff}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .ic{font-size:32px}
.topic b{font-family:var(--f-display);font-size:17px}
.topic .meter{margin-top:8px;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.topic .meter i{display:block;height:100%;background:var(--lv)}
/* word cards */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.word{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.word .em{font-size:40px;line-height:1.1}
.word .w{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--lv)}
.word .s{font-size:13px;color:var(--muted)}
.word .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.saved{background:var(--lv)!important;color:#fff!important;border-color:var(--lv)!important}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button span{font-size:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span{transform:scale(1.15)}
.badge-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:inline-grid;place-items:center;margin-left:4px}
.cap{font-family:var(--f-display);font-size:22px;line-height:1.4;text-align:center;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--lv);color:var(--lv)}
.hl{color:var(--lv);background:color-mix(in srgb,var(--lv) 15%,transparent);border-radius:6px;padding:0 4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-family:var(--f-display);font-size:19px;font-weight:700}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.choice.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card));animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
/* session */
.steps{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px}
.steps div{text-align:center;font-size:12px;font-weight:600;padding:6px 2px;border-radius:10px;background:var(--soft);color:var(--muted)}
.steps div.on{background:var(--lv);color:#fff}
.steps div.done{background:color-mix(in srgb,var(--lv) 25%,var(--card));color:var(--ink)}
.prompt-em{font-size:72px;text-align:center;line-height:1.1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;min-height:64px;font-family:var(--f-display);font-size:19px;font-weight:700}
.match .em{font-size:38px}
.match button.sel{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 40%,transparent)}
.match button.gone{visibility:hidden}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:42px;height:50px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:800;background:var(--card)}
.slot.f{border-style:solid;border-color:var(--lv);color:var(--lv)}
.slot.gap{border:0;background:transparent;width:14px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--sun);color:var(--sun-ink);font-family:var(--f-display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.tile[disabled]{opacity:.25;box-shadow:none}
.mic{width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:var(--bad);color:#fff;font-size:40px;box-shadow:0 4px 0 var(--ink)}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.letters{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:2px;text-align:center}
.letters .g{color:var(--good)} .letters .r{color:var(--bad);text-decoration:underline wavy}
.score{font-family:var(--f-display);font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* flashcard */
.fc{perspective:1200px;width:100%;max-width:440px;margin:0 auto;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:3px solid var(--lv);background:var(--card);box-shadow:0 5px 0 var(--lv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-word{font-family:var(--f-display);font-size:40px;font-weight:800;color:var(--lv);line-height:1.1;overflow-wrap:anywhere}
.fc-vi{font-family:var(--f-display);font-size:30px;font-weight:700}
.fc-em{font-size:84px;line-height:1}
.fc-hint{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.k{background:var(--good);border-color:var(--good)}
.dots i.l{background:var(--sun);border-color:var(--sun)}
.dots i.c{outline:2px solid var(--ink)}
/* chat */
.scene{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.scene .av{font-size:44px;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--soft)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--lv);color:#fff;border-bottom-right-radius:6px}
.msg .en{font-family:var(--f-display);font-size:19px;font-weight:600}
.msg .vi{font-size:13px;color:var(--muted);margin-top:4px}
.msg .fix{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--sun) 25%,transparent)}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{text-align:left;border:2px solid var(--lv);background:var(--card);border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-size:18px;font-weight:600}
.typing{display:flex;gap:8px}
.typing input{flex:1;min-width:0}
/* notebook */
.nb-list{display:flex;flex-direction:column;gap:8px}
.nb{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.nb .em{font-size:30px;text-align:center}
.nb b{font-family:var(--f-display);font-size:18px}
.boxes{display:flex;gap:3px}
.boxes i{width:8px;height:16px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.boxes i.on{background:var(--sun);border-color:var(--sun)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-size:12px;font-weight:600}
.bdg span{display:block;font-size:30px}
.bdg.off{opacity:.35;filter:grayscale(1)}
/* teacher */
label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl{overflow-x:auto}

/* patterns */
.pats{display:flex;flex-direction:column;gap:8px}
.pat{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--soft)}
.pat b{font-family:var(--f-display);font-size:17px;font-weight:600;display:block}
.pat span{font-size:13px;color:var(--muted)}
/* meme */
.meme{--meme-bg:#22302A;--meme-ink:#FFFFFF;background:radial-gradient(circle at 50% 45%,#3A4D44,var(--meme-bg) 70%);border:4px solid #0E1512;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:100%;max-width:340px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.meme .mt,.meme .mb{font-family:var(--f-meme);text-transform:uppercase;color:var(--meme-ink);font-size:24px;line-height:1.1;letter-spacing:.5px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000;text-wrap:balance}
.meme .me{font-size:84px;line-height:1.1}
.meme.big .me{font-size:110px}
.meme-pop{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;width:min(320px,86vw);animation:memein .35s ease-out;cursor:pointer}
@keyframes memein{from{transform:translate(-50%,-20px) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
/* voice chat */
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:18px}
.voice .mic{width:84px;height:84px;font-size:36px}
.ex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ex button{border:1px dashed var(--lv);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.msg.me.bad{background:color-mix(in srgb,var(--bad) 75%,var(--card))}
/* homework */
.hw-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hw-hero .ic{font-size:52px;width:84px;height:84px;display:grid;place-items:center;border-radius:24px;background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 20%,var(--card));color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pill.wait{background:color-mix(in srgb,var(--sun) 30%,var(--card));color:var(--sun-ink)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.qchip.ok{border-color:var(--good);color:var(--good)}
.qchip.no{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.games{display:flex;flex-wrap:wrap;gap:8px}
.games label{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.hwrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hwrow:last-child{border-bottom:0}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover{background:var(--soft)}
.rank{font-family:var(--f-display);font-weight:800}

/* pattern sentences in practice */
.word .ps{color:var(--ink);font-weight:500}
.fc-pat{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:15px;text-align:center}
.fc-pat b{font-family:var(--f-display);font-weight:600}
.fc-pat span{font-size:13px;color:var(--muted)}
.cap-vi{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:6px}
.bline{min-height:60px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border:2px dashed var(--lv);border-radius:14px;background:var(--card)}
.tok{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 12px;font-family:var(--f-display);font-size:18px;font-weight:600;box-shadow:0 2px 0 var(--ink)}
.tok.on{border-color:var(--lv);color:var(--lv);box-shadow:none}
.tok.no{border-color:var(--bad);color:var(--bad);animation:shake .3s}
.tok[disabled]{opacity:.2;box-shadow:none}

/* lessons */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lesson{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lesson b{font-family:var(--f-display);font-size:18px}
.lesson .les-em{font-size:24px;letter-spacing:2px;overflow-wrap:anywhere}
.lesson.next{border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.lesson.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
/* profile, feedback, saved patterns */
.wface{font-size:64px;line-height:1;width:96px;height:96px;display:grid;place-items:center;border-radius:28px;background:var(--soft)}
.wface.sm{font-size:28px;width:44px;height:44px;border-radius:14px}
.pat{grid-template-columns:auto 1fr auto!important}
.skills{display:flex;flex-direction:column;gap:6px}
.skrow{display:grid;grid-template-columns:minmax(110px,150px) 1fr 44px;gap:8px;align-items:center;font-size:14px}
.skrow b{text-align:right;font-variant-numeric:tabular-nums}
.skbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.skbar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.skbar i.hi{background:var(--good)}
.skbar i.lo{background:var(--bad)}
.fbl{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.fb p,.fb li{line-height:1.5}
.fixrow{padding:8px 10px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.fixrow .better{color:var(--ink)}
/* streak + leaderboard + visits */
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.streak .flame{font-size:48px;width:76px;height:76px;display:grid;place-items:center;border-radius:24px;background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft)}
.lb li.you{outline:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 18%,var(--card))}
.lb .rk{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.lb b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .st{font-variant-numeric:tabular-nums;font-weight:600}
.vbars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:140px;overflow-x:auto}
.vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:18px}
.vb i{display:block;width:70%;min-height:2px;background:var(--lv);border-radius:4px 4px 0 0}
.vb .vn{font-size:11px;font-variant-numeric:tabular-nums}
.vb .vd{font-size:10px;color:var(--muted);white-space:nowrap}
/* teacher library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.libcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.libcard.new{border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.libcard b{font-family:var(--f-display);font-size:18px;overflow-wrap:anywhere}
.libic{font-size:34px;line-height:1}
.seg{scrollbar-width:thin}

/* video */
nav.tabs button{font-size:11px;padding-left:2px;padding-right:2px}
.ytwrap{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.ytwrap iframe,.ytwrap #ytbox{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytmsg{padding:14px;border-radius:12px;background:var(--soft);color:var(--ink);text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcard{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vcard b{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.vthumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--lv) 25%,var(--soft))}
.vthumb::before{content:"🎬";position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.tscript{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto;padding:4px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.tline{display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-size:16px}
.tline .tt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.tline.on{background:color-mix(in srgb,var(--lv) 18%,var(--card));font-weight:600}
.tline[disabled]{cursor:default}
.cap .g{color:var(--good);font-weight:700}.cap .r{color:var(--bad);text-decoration:underline wavy}
.cccover{position:absolute;left:0;right:0;bottom:0;height:36%;z-index:2;display:grid;place-items:center;background:#1d1a17;color:#fff;font-size:14px;pointer-events:none}
.cccover[hidden]{display:none}
.vpart{justify-content:center;gap:8px;align-items:center}
.vpart:empty{display:none}

</style>
</head>

function savePat(lv,tp,p){P.pats=P.pats||{};const k=patKey(lv,tp,p.en);if(!P.pats[k])P.pats[k]={en:p.en,vi:p.vi||'',lv,tp,box:0,due:Date.now(),added:Date.now()};saveP()}

function addStars(n){
  P.stars+=n;const t=today();
  const S=P.streak;
  if(S.last!==t){const missed=S.last?Math.max(0,dayNum(t)-dayNum(S.last)-1):0;
    if(!S.last||missed===0)S.n=S.last?S.n+1:1;
    else if(missed<=S.freeze){S.freeze-=missed;S.used+=missed;S.n++;setTimeout(()=>toast(`🧊 Đã dùng ${missed} lần đóng băng để giữ chuỗi ${S.n} ngày!`),600)}
    else{if(S.n>1)setTimeout(()=>toast('Chuỗi cũ đã mất. Bắt đầu chuỗi mới hôm nay nhé! 🔥'),600);S.n=1}
    S.last=t;if(S.n>S.best)S.best=S.n;
    if(S.n>0&&S.n%10===0&&S.freeze<3){S.freeze++;setTimeout(()=>{toast('🧊 Giữ chuỗi 10 ngày: con nhận thêm 1 lần đóng băng!');confetti()},1200)}}
  pingSoon();
  checkBadges();saveP();
}

function toggleNb(id){if(P.nb[id])delete P.nb[id];else{P.nb[id]={box:0,due:Date.now(),added:Date.now()};checkBadges()}saveP()}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#F2B52A','#2B9A57','#2C7CCB','#D9741A','#D04545'];const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*5)]}));let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<80)requestAnimationFrame(tick);else c.remove()})()}

/* ===================== AUDIO: TTS + speech recognition ===================== */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
const stripEmoji=t=>String(t).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍⃣]/gu,'').replace(/\s+/g,' ').trim();
const FEMALE=/female|woman|samantha|karen|serena|kate|libby|sonia|susan|hazel|zira|jenny|aria|ava|allison|victoria|moira|tessa|fiona|emma|amy|joanna|salli|kimberly|google uk english female|google us english/i;
function pickVoice(){const en=VOICES.filter(v=>/^en/i.test(v.lang));return en.find(v=>/en-GB/i.test(v.lang)&&FEMALE.test(v.name))||en.find(v=>FEMALE.test(v.name))||en.find(v=>/en-GB/i.test(v.lang))||en[0]||null}
function utter(text,rate){const u=new SpeechSynthesisUtterance(stripEmoji(text));const v=pickVoice();u.pitch=1.1;if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=rate;return u}
function speak(text,rate=.85){try{speechSynthesis.cancel();speechSynthesis.speak(utter(text,rate))}catch(e){toast('Thiết bị này chưa đọc to được')}}
function speakSeq(texts,rate=.85){try{speechSynthesis.cancel();texts.filter(Boolean).forEach(t=>speechSynthesis.speak(utter(t,rate)))}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let IN_FRAME=true;try{IN_FRAME=window.self!==window.top}catch(e){IN_FRAME=true}
let micBlocked=IN_FRAME;
const voiceOK=()=>!!SR&&!micBlocked;
function listenOnce(){return new Promise((res,rej)=>{if(!SR||micBlocked)return rej('unsupported');let r;try{r=new SR()}catch(e){return rej('unsupported')}r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;let got=false;r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')micBlocked=true;rej(e.error)};r.onend=()=>{if(!got)rej('no-speech')};try{r.start()}catch(e){rej('unsupported')}})}
function micErrorText(e){return e==='not-allowed'||e==='service-not-allowed'?'Trình duyệt đang chặn micro. Bấm biểu tượng ổ khóa cạnh địa chỉ trang → cho phép Micro → tải lại trang.':e==='network'?'Nhận giọng nói cần mạng internet. Kiểm tra mạng rồi thử lại nhé.':e==='audio-capture'?'Không tìm thấy micro trên thiết bị này.':e==='unsupported'?'Trình duyệt này chưa nghe được giọng nói. Hãy mở bằng Chrome hoặc Safari.':''+NAME+' chưa nghe thấy gì, bé bấm micro và nói to hơn nhé.'}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){n=+n;if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');if(n===100)return 'one hundred';return String(n)}
const norm=s=>String(s).toLowerCase().replace(/[-–]/g,' ').replace(/\b(\d{1,3})\b/g,(m,d)=>+d<=100?numWords(d):m).replace(/[^a-z0-9' ]/g,'').replace(/'/g,'').replace(/\s+/g,' ').trim();
function scoreSpeech(target,alts){const t=norm(target).replace(/ /g,'');let best={sc:0,heard:alts[0]||'',tok:''};for(const a of alts){const toks=norm(a).split(' ').filter(Boolean);const n=norm(target).split(' ').length;for(let i=0;i<toks.length;i++){const cand=toks.slice(i,i+n).join('');const sc=Math.round((1-lev(t,cand)/Math.max(t.length,cand.length))*100);if(sc>best.sc)best={sc,heard:a,tok:cand}}}return best}
function letterMarks(target,heard){const a=target.toLowerCase(),b=heard;const m=a.length,n=b.length;const L=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);const ok=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}return [...target].map((ch,k)=>ch===' '||ch==='-'?ch:`<span class="${ok[k]?'g':'r'}">${esc(ch)}</span>`).join('')}
function matchAnswer(alts,ans){let best={sc:0,heard:alts[0]||''};for(const h of alts){const hn=norm(h);for(const a of ans){let sc;if(a.startsWith('~')){const p=norm(a.slice(1));sc=hn.startsWith(p)?100:Math.round((1-lev(p,hn.slice(0,p.length))/Math.max(p.length,1))*100)}else{const an=norm(a);sc=Math.round((1-lev(an,hn)/Math.max(an.length,hn.length,1))*100)}if(sc>best.sc)best={sc,heard:h}}}return best}
const examples=ans=>ans.filter(a=>!a.startsWith('~'));

let SESSION=null;
const STAGE_BY={c:['cards','🃏 Thẻ'],l:['listen','🎧 Nghe'],r:['read','📖 Đọc'],p:['build','🧩 Câu'],s:['speak','🎙️ Nói'],w:['write','✏️ Viết'],y:['saysent','🗣️ Đọc câu']};
function startLesson(T,k){const L2=lessonsOf(T);if(!L2[k])return;startSession(L2[k],`${T.name} · Bài ${k+1}/${L2.length}`,0,{lesson:{lv:L2[k][0].lv,tp:T.id,k}})}
function startSession(words,label,max=5,opt={}){
  words=words.slice(0,max||words.length);if(!words.length)return toast('Chưa có từ để học');
  const stages=(opt.games||'clrpsw').split('').filter(k=>STAGE_BY[k]).map(k=>STAGE_BY[k]);if(!stages.length)stages.push(STAGE_BY.l);
  SESSION={lesson:opt.lesson||null,label,all:words,words:stages[0][0]==='cards'?[]:words.slice(),known:{},stages,stage:0,i:0,res:Object.fromEntries(words.map(w=>[w.id,0])),stars:0,streak:0,miss:0,items:[],hw:opt.hw||null,t0:Date.now(),finished:false};
  route.tab='session';setLv(words[0].lv);renderSession();window.scrollTo(0,0);
}
function sHeader(){return `<div class="row" style="justify-content:space-between">${SESSION.hw?`<span class="pill wait">📮 Bài tập về nhà</span>`:'<button class="btn sm ghost" id="s-quit">✕ Thoát</button>'}<span class="chip" id="s-stars">⭐ +${SESSION.stars}</span></div>
  <div><span class="tag">${esc(SESSION.label)}</span></div>
  <div class="steps" style="--n:${SESSION.stages.length}">${SESSION.stages.map((s,k)=>`<div class="${k===SESSION.stage?'on':k<SESSION.stage?'done':''}">${s[1]}</div>`).join('')}</div>`}
function stageLen(){const st=SESSION.stages[SESSION.stage][0];return st==='cards'?SESSION.all.length:st==='read'?Math.ceil(SESSION.words.length/4):SESSION.words.length}
function sNext(){SESSION.i++;if(SESSION.i>=stageLen()){if(SESSION.stages[SESSION.stage][0]==='cards'){SESSION.words=SESSION.hw?SESSION.all.slice():SESSION.all.filter(w=>!SESSION.known[w.id]);if(!SESSION.words.length)SESSION.stage=SESSION.stages.length-1}SESSION.stage++;SESSION.i=0}renderSession();window.scrollTo(0,0)}
function sRecord(g,w,ok,note){
  SESSION.items.push({n:SESSION.items.length+1,g,w:w.pat?w.s:w.w,ok:!!ok,note:note||''});if(note!=='bỏ qua')statRec(w,g,ok);else statSkip(w,g);
  if(ok){SESSION.res[w.id]++;SESSION.stars++;SESSION.streak++;if(SESSION.streak===3)popMeme('streak');else if(SESSION.streak===6)popMeme('streak6')}
  else{SESSION.streak=0;SESSION.miss++;if(SESSION.miss===2||SESSION.miss===5)popMeme('oops')}
  const c=$('#s-stars');if(c)c.textContent='⭐ +'+SESSION.stars;
}
function sWrongFx(){SESSION.streak=0}
function renderSession(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.removeAttribute('aria-current'));
  if(SESSION.stage>=SESSION.stages.length)return sFinish();
  const st=SESSION.stages[SESSION.stage][0];
  $('#view').innerHTML=`<section class="stack">${sHeader()}<div id="game" class="stack"></div></section>`;
  $('#s-quit')&&($('#s-quit').onclick=()=>{SESSION=null;go({tab:'home'})});

}

const CHAT={log:[],lv:'starters',tp:'body',msgs:[],scene:'',busy:false,mode:null,turns:[],turn:0,tries:0,showVi:true,listening:false,hint:false,done:false,sugs:[],streak:0};

async function chatMic(){
  if(CHAT.listening||CHAT.busy)return;CHAT.listening=true;vChat();
  try{const alts=await listenOnce();CHAT.listening=false;chatSay(alts[0]||'',alts)}
  catch(e){CHAT.listening=false;vChat();toast(micErrorText(e))}
}
function chatSay(text,alts){text=String(text||'').trim().slice(0,200);if(!text)return;if(CHAT.mode==='ai')return aiSend(text);dlgAnswer(text,alts||[text])}
const MAX_MORE=2;
function chatCredit(){if(CHAT.credited)return;CHAT.credited=true;addStars(3);P.chats=(P.chats||0)+1;checkBadges();saveP();confetti()}
function chatCheckpoint(){if((CHAT.rounds||0)>=MAX_MORE){CHAT.msgs.push({role:'ai',en:'Thank you for talking with me! Goodbye!',vi:'Cảm ơn con đã trò chuyện với cô! Tạm biệt!'});chatCredit();CHAT.checkpoint=false;CHAT.done=true;return}
  CHAT.checkpoint=true;CHAT.msgs.push({role:'ai',en:"We've finished our topic! Do you want to stop or talk more?",vi:'Mình nói xong chủ đề rồi! Con muốn dừng lại hay nói thêm?'});chatCredit()}
function chatEnd(){speechSynthesis.cancel();if(!CHAT.done){CHAT.done=true;CHAT.checkpoint=false;const n=CHAT.mode==='dialog'?CHAT.log.length:CHAT.msgs.filter(m=>m.role==='me').length;if(n&&!CHAT.credited){CHAT.credited=true;addStars(2);P.chats=(P.chats||0)+1;checkBadges();saveP()}}CHAT.listening=false;CHAT.busy=false;vChat()}
function moreTurns(T,n){const used=new Set(CHAT.turns.map(t=>t.w).filter(Boolean));const ws=shuffle(T.words.filter(w=>!used.has(w.w))).slice(0,n);
  return ws.map((w,k)=>{const k3=k%3;
    if(k3===0)return {w:w.w,q:`Look! ${w.e} What's this?`,vi:'Nhìn này! Đây là gì?',ans:[w.w+'.',`It's ${art(w.w)} ${w.w}.`],re:{en:`This is "${w.w}". ${w.s}`,vi:`Đây là "${w.w}" – ${w.vi}.`}};
    if(k3===1)return {w:w.w,q:`Can you make a sentence with "${w.w}"? ${w.e}`,vi:`Con đặt một câu với từ "${w.w}" (${w.vi}) nhé.`,ans:[w.s],re:{en:`Nice! Here's my sentence: ${w.s}`,vi:'Hay lắm! Đây là câu của cô.'}};
    return {w:w.w,q:`Can you say "${w.w}"? ${w.e}`,vi:`Con nói từ "${w.w}" được không?`,ans:[w.w+'.',`Yes, I can. ${capF(w.w)}!`],re:{en:`Well done! ${w.s}`,vi:`Giỏi lắm! "${w.w}" nghĩa là ${w.vi}.`}}})}
function dlgMore(){const T=topicOf(CHAT.lv,CHAT.tp);const extra=moreTurns(T,3);if(!extra.length){toast('Mình đã nói hết từ của chủ đề rồi!');return chatEnd()}
  CHAT.rounds=(CHAT.rounds||0)+1;CHAT.checkpoint=false;CHAT.turns=CHAT.turns.concat(extra);
  CHAT.msgs.push({role:'ai',en:"Great! Let's talk a little more.",vi:'Tuyệt! Mình nói thêm chút nữa nhé.'});dlgAsk();vChat();
  speakSeq(["Great! Let's talk a little more.",CHAT.turns[CHAT.turn].q])}
function dlgStart(){
  const T=topicOf(CHAT.lv,CHAT.tp);CHAT.mode='dialog';CHAT.turns=dlgOf(T).slice(0,6);CHAT.turn=0;CHAT.lastRe=false;CHAT.rounds=0;CHAT.checkpoint=false;CHAT.credited=false;CHAT.done=false;CHAT.streak=0;CHAT.log=[];CHAT.hint=false;
  CHAT.scene=`${NAME} hỏi con ${CHAT.turns.length} câu về chủ đề ${T.vi}. Con trả lời theo ý con nhé!`;
  const nm=me().name;CHAT.msgs=[{role:'ai',en:`Hi${nm?' '+nm:''}! I'm ${NAME}. Let's talk!`,vi:`Chào ${nm||'con'}! Cô là ${NAME}. Cùng nói chuyện nhé!`}];
  dlgAsk();vChat();speakSeq(CHAT.msgs.filter(m=>m.role==='ai').map(m=>m.en));
}
function dlgAsk(){const t=CHAT.turns[CHAT.turn];if(!t){chatCheckpoint();return}CHAT.hint=false;CHAT.msgs.push({role:'ai',en:t.q,vi:t.vi})}
const REACT_OK=[['Great!','Tuyệt!'],['Nice!','Hay quá!'],['Wonderful!','Tuyệt vời!'],['Good answer!','Câu trả lời hay!']];
const REACT_FREE=[['I see!','Cô hiểu rồi!'],['Oh, really? Nice!','Ồ, thật à? Hay đấy!'],['Thank you for telling me!','Cảm ơn con đã kể cho cô!'],["Oh, that's interesting!",'Ồ, thú vị ghê!']];
function dlgAnswer(text,alts){
  const t=CHAT.turns[CHAT.turn];if(!t||CHAT.done)return;
  const r=matchAnswer(alts,t.ans);const ok=r.sc>=70;const ex=examples(t.ans);
  const yn0=ex.some(a=>/^(yes|no)\b/i.test(a));const neg=/n't|\bnot\b|\bno\b/i.test(text);
  const close=(yn0&&!ok?ex.find(a=>neg?/^no\b/i.test(a):/^yes\b/i.test(a)):null)||ex.slice().sort((a,b)=>lev(norm(a),norm(text))-lev(norm(b),norm(text)))[0]||'';
  const longest=ex.slice().sort((a,b)=>b.split(' ').length-a.split(' ').length)[0]||'';
  CHAT.log.push({q:t.q,qvi:t.vi,said:text,ok,model:close,full:longest});
  CHAT.msgs.push({role:'me',en:text});
  const yn=ex.some(a=>/^(yes|no)\b/i.test(a));const hn=norm(text);
  const last=CHAT.turn+1>=CHAT.turns.length;
  const re=t.re&&t.re.en?[t.re.en,t.re.vi]:ok?pick(REACT_OK):yn&&/\byes\b/.test(hn)?['Oh, yes! Nice.','Ồ, có à! Hay quá.']:yn&&/\bno\b/.test(hn)?['Oh, OK!','À, ra vậy!']:pick(REACT_FREE);
  CHAT.lastRe=!!(t.re&&t.re.en&&last);
  CHAT.msgs.push({role:'ai',en:re[0],vi:re[1]});addStars(ok?2:1);
  if(ok){CHAT.streak++;if(CHAT.streak===3)popMeme('streak');P.speakGood++}else CHAT.streak=0;
  CHAT.turn++;dlgAsk();vChat();
  const lastAi=CHAT.msgs[CHAT.msgs.length-1];speakSeq([re[0],lastAi&&lastAi.role==='ai'&&lastAi.en!==re[0]?lastAi.en:'']);
}
function chatFeedbackHTML(){
  let rows=[];
  if(CHAT.mode==='dialog')rows=(CHAT.log||[]).map(l=>({q:l.q,said:l.said,good:l.ok,tip:l.ok?(l.said.split(/\s+/).length<=2&&l.full.split(' ').length>2?'Con có thể nói cả câu: '+l.full:''):l.model}));
  else{for(let i=0;i<CHAT.msgs.length;i++){const m=CHAT.msgs[i];if(m.role!=='me')continue;const q=[...CHAT.msgs.slice(0,i)].reverse().find(x=>x.role==='ai');rows.push({q:q?q.en:'',said:m.en,good:!m.fix,tip:m.fix||''})}}
  const n=rows.length;
  if(!n)return `<div class="card">${memeHTML(pick(MEMES.chat))}<p class="muted" style="margin:8px 0 0;text-align:center">Lần sau con thử trả lời vài câu để ${esc(NAME)} nhận xét nhé!</p></div>`;
  const good=rows.filter(r=>r.good),fix=rows.filter(r=>!r.good||r.tip);const nm=me().name;
  const pctG=good.length/n;
  const head=pctG>=.8?`Con nói rất tốt! 🌟`:pctG>=.5?`Con trò chuyện giỏi lắm! 👏`:`Con đã mạnh dạn nói tiếng Anh, cô rất vui! 💪`;
  return `<div class="card stack fb" style="gap:10px">
    <div class="row" style="gap:10px;align-items:center"><span class="wface sm" aria-hidden="true">${MICON}</span><h3 style="margin:0">Nhận xét của ${esc(NAME)}</h3></div>
    <p style="margin:0"><b>${head}</b> ${nm?esc(nm)+' ':'Con '}đã trả lời ${n} câu, trong đó ${good.length} câu dùng đúng mẫu câu.</p>
    ${good.length?`<div><b>👍 Câu con nói hay:</b><ul class="fbl">${good.slice(0,4).map(r=>`<li>“${esc(r.said)}”</li>`).join('')}</ul></div>`:''}

    <p class="muted" style="margin:0;font-size:13px">Câu trả lời khác câu mẫu vẫn có thể đúng. Gợi ý ở trên giúp con nói đầy đủ và tự nhiên hơn.</p>
  </div>${memeHTML(pick(MEMES.chat))}`;
}

function aiPrompt(){
  const L=lvOf(CHAT.lv),T=topicOf(CHAT.lv,CHAT.tp);const turns=CHAT.msgs.filter(m=>m.role==='me').length;
  return `You are ${NAME}, a kind and cheerful English teacher, playing a short role-play with a Vietnamese child aged 6-11 who is learning English at Cambridge YLE ${L.name} level (CEFR ${L.cefr}).
Topic: ${T.name} (${T.vi}). Target words: ${T.words.map(w=>w.w).join(', ')}.
Target sentence patterns: ${T.pats.map(p=>p.en).join(' / ')}.
Pick one simple real-life situation for this topic and keep it for the whole talk.
Rules:
- Use only very simple English for ${L.name}: 1-2 short sentences, at most 10 words each. React to the content of what the child said and add one small detail that moves the story forward (never just "Great!" or "Interesting!" on its own), then ask ONE simple follow-up question that invites them to use a target pattern.
- The child may answer freely. Do NOT correct the child during the talk and never say their answer is wrong. Just reply naturally and keep the conversation going.
- If the child's last message has a mistake or could be said more fully, put a better simple version in "correction" (it is shown to the child only at the end). Otherwise leave it empty.
- Never ask for or repeat personal information (real name, age, address, school, phone, photos). If the child gives some, don't repeat it and move on.
- If the child goes off topic or writes something unkind or unsafe, gently bring the talk back to the situation.
- The child has answered ${turns} times. When the child has answered ${CHAT.aiLimit||6} times, wrap up this part of the topic warmly in one short sentence, ask no question, and set "done" to true.
${CHAT.contNote?'- The child chose to keep talking. Start a new small part of the same situation and ask a new question.':''}
- "suggestions": 3 short example answers the child could give, correct English at ${L.name} level, different meanings, at most 8 words.
${turns===0?'This is the start: greet the child and set the scene. Also fill "scene_vi" with one short Vietnamese sentence describing the situation.':''}
Conversation so far:
${CHAT.msgs.map(m=>(m.role==='ai'?NAME+': ':'Child: ')+m.en).join('\n')||'(none)'}
Reply with JSON only: {"reply":"...","reply_vi":"natural Vietnamese translation","correction":"","suggestions":["...","...","..."],"scene_vi":"","done":false}`;
}
async function aiMore(){CHAT.rounds=(CHAT.rounds||0)+1;CHAT.aiLimit=(CHAT.aiLimit||6)+4;CHAT.checkpoint=false;CHAT.contNote=true;CHAT.busy=true;vChat();await aiTurn();CHAT.contNote=false}
async function aiStart(){CHAT.rounds=0;CHAT.aiLimit=6;CHAT.checkpoint=false;CHAT.credited=false;CHAT.contNote=false;CHAT.mode='ai';CHAT.msgs=[{role:'ai',en:'Hi! Let\'s talk!',vi:'Chào con! Cùng nói chuyện nhé!'}];CHAT.done=false;CHAT.sugs=[];CHAT.hint=false;CHAT.busy=true;CHAT.scene='';vChat();await aiTurn()}
async function aiSend(text){if(CHAT.busy||CHAT.done||!text)return;CHAT.msgs.push({role:'me',en:text});CHAT.busy=true;CHAT.sugs=[];CHAT.hint=false;vChat();await aiTurn()}
async function aiTurn(){
  try{const out=await SAMPLE.json(aiPrompt(),{modelTier:'quick',cache:false});
    if(out.scene_vi)CHAT.scene=out.scene_vi;
    const lastMe=[...CHAT.msgs].reverse().find(m=>m.role==='me');if(lastMe&&out.correction&&norm(out.correction)!==norm(lastMe.en))lastMe.fix=String(out.correction);
    CHAT.msgs.push({role:'ai',en:String(out.reply||''),vi:String(out.reply_vi||'')});
    CHAT.sugs=Array.isArray(out.suggestions)?out.suggestions.slice(0,3).map(String):[];
    if(lastMe)addStars(1);
    if(out.done)chatCheckpoint();
    CHAT.busy=false;vChat();speak(CHAT.msgs[CHAT.msgs.length-1].en);
  }catch(e){CHAT.busy=false;
    if(e&&(e.code==='not_granted'||e.code==='unavailable')){SAMPLE=null;toast('AI chưa được bật, chuyển sang luyện hội thoại theo chủ đề');return dlgStart()}
    const last=CHAT.msgs[CHAT.msgs.length-1];if(last&&last.role==='me'){CHAT.msgs.pop();CHAT.sugs=[last.en]}
    toast(e&&e.code==='rate_limited'?NAME+' đang bận, đợi một chút rồi thử lại nhé':NAME+' chưa trả lời được, con gửi lại câu trả lời nhé');vChat()}
}

function libParseWords(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [w,vi,e,s]=l.split('|').map(x=>(x||'').trim());return {w,vi,e,s}}).filter(x=>x.w)}
function libParsePats(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [en,vi]=l.split('|').map(x=>(x||'').trim());return {en,vi}}).filter(x=>x.en)}
function libAutoFill(ws){return ws.map(w=>{const d=dictLookup(w.w);return {w:w.w,vi:w.vi||(d?d.vi:''),e:w.e||(d?d.e:''),s:w.s||(d?d.s:''),src:d?'dict':''}})}

  $('#ve-save').onclick=()=>{readBounds();V.title=$('#ve-title').value.trim();V.checked=$('#ve-ok').checked;V.pub=$('#ve-pub').checked;
    if(!V.yt){const id=ytId($('#ve-url').value);if(id)V.yt=id}
    if(!V.yt)return toast('Dán link YouTube và bấm ▶ Tải video');if(!V.title)return toast('Nhập tên video');if(!(V.end>V.start))return toast('Mốc thời gian chưa đúng');
    if(!V.lines.length&&$('#ve-tr').value.trim())parse();
    if(!V.checked)return toast('Bạn cần xem hết video và đánh dấu ô kiểm duyệt trước khi lưu');
    C.vlib=C.vlib||{};C.vlib[V.id]={...V,parts:false,updated:Date.now()};saveC();toast(vSynced(V)?'Đã lưu video':!V.lines.length?'Đã lưu. Học sinh sẽ luyện theo phụ đề YouTube.':'Đã lưu. Nhớ đồng bộ thời gian để học sinh dùng được Nhại theo và Chép chính tả.');go({vedit:null})};
}

/* ===================== BOOT ===================== */
render();
if(me().name)ping(true);
getSample().then(s=>{if(s&&route.tab==='chat'&&!CHAT.msgs.length)vChat()});
flushOutbox();
if(location.protocol.startsWith('http')&&!IN_FRAME){fetch('content.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.topics){SHARED={topics:Object.assign({starters:[],movers:[],flyers:[]},d.topics),extra:d.extra||{},videos:d.videos||{},vids:Array.isArray(d.vids)?d.vids:[],vhide:Array.isArray(d.vhide)?d.vhide:[]};buildData()}}).catch(()=>{}).finally(()=>{if(!SESSION&&(route.tab!=='chat'||!CHAT.msgs.length)&&!(route.tab==='video'&&route.vid)&&!(route.tab==='teacher'&&route.tview==='video'))render()})}

</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
