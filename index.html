<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YLE Video Words</title>
<meta name="theme-color" content="#2B9A57">
<meta name="description" content="Học từ vựng Cambridge YLE Starters, Movers, Flyers: thẻ từ, Nghe, Đọc, Nói, Viết, trò chuyện và bài tập về nhà.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Grandstander:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap">
<script src="config.js"></script>
<style>
body{margin:0}

/* Layout: one-column app shell like an exercise notebook, sticky top bar, tab bar fixed at the bottom; each level owns a colour */
:root{
  --paper:#F1F6F2; --card:#FFFFFF; --ink:#1E2A25; --muted:#5B6962; --line:#D6E1D9;
  --gs1:#B8336F; --pu1:#7A4FD0; --pu2:#0E8F8C; --pu3:#C24A2C; --pu4:#3F5BB8; --starters:#2B9A57; --movers:#2C7CCB; --flyers:#D9741A; --sun:#F2B52A; --sun-ink:#5A3D00;
  --good:#2B9A57; --bad:#D04545; --soft:#E6EFE8; --shadow:0 2px 0 rgba(30,42,37,.08);
  --f-display:"Grandstander","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --f-meme:"Anton",Impact,"Arial Black",sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --lv:var(--starters);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131B17; --card:#1C2621; --ink:#E7EEE9; --muted:#9BA9A1; --line:#2D3A33;
  --gs1:#E7679F; --pu1:#A88BF0; --pu2:#3CC4C0; --pu3:#EE7C5E; --pu4:#7C93E8; --starters:#4CC27D; --movers:#5BA3EF; --flyers:#F29B48; --sun:#F6C64F; --sun-ink:#2A1D00;
  --good:#4CC27D; --bad:#F06B6B; --soft:#24302A; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131B17; --card:#1C2621; --ink:#E7EEE9; --muted:#9BA9A1; --line:#2D3A33;
  --gs1:#E7679F; --pu1:#A88BF0; --pu2:#3CC4C0; --pu3:#EE7C5E; --pu4:#7C93E8; --starters:#4CC27D; --movers:#5BA3EF; --flyers:#F29B48; --sun:#F6C64F; --sun-ink:#2A1D00;
  --good:#4CC27D; --bad:#F06B6B; --soft:#24302A; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.2px;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section{margin-top:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:600;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--lv);border-color:var(--lv);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--lv) 60%,#000)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{font-size:18px;padding:14px 20px}
/* home */
.pet{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pet .face{font-size:64px;line-height:1;width:96px;height:96px;display:grid;place-items:center;border-radius:28px;background:var(--soft);border:2px dashed var(--line)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.levels{grid-template-columns:1fr}}
.lvcard{text-align:left;border:2px solid var(--lc);border-radius:18px;padding:14px;background:var(--card);box-shadow:0 4px 0 var(--lc);display:flex;flex-direction:column;gap:4px}
.lvcard b{font-family:var(--f-display);font-size:22px;color:var(--lc)}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* tabs */
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--lv);color:#fff}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .ic{font-size:32px}
.topic b{font-family:var(--f-display);font-size:17px}
.topic .meter{margin-top:8px;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.topic .meter i{display:block;height:100%;background:var(--lv)}
/* word cards */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.word{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.word .em{font-size:40px;line-height:1.1}
.word .w{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--lv)}
.word .s{font-size:13px;color:var(--muted)}
.word .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.saved{background:var(--lv)!important;color:#fff!important;border-color:var(--lv)!important}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button span{font-size:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span{transform:scale(1.15)}
.badge-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:inline-grid;place-items:center;margin-left:4px}
.cap{font-family:var(--f-display);font-size:22px;line-height:1.4;text-align:center;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--lv);color:var(--lv)}
.hl{color:var(--lv);background:color-mix(in srgb,var(--lv) 15%,transparent);border-radius:6px;padding:0 4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-family:var(--f-display);font-size:19px;font-weight:700}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.choice.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card));animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
/* session */
.steps{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px}
.steps div{text-align:center;font-size:12px;font-weight:600;padding:6px 2px;border-radius:10px;background:var(--soft);color:var(--muted)}
.steps div.on{background:var(--lv);color:#fff}
.steps div.done{background:color-mix(in srgb,var(--lv) 25%,var(--card));color:var(--ink)}
.prompt-em{font-size:72px;text-align:center;line-height:1.1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;min-height:64px;font-family:var(--f-display);font-size:19px;font-weight:700}
.match .em{font-size:38px}
.match button.sel{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 40%,transparent)}
.match button.gone{visibility:hidden}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:42px;height:50px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:800;background:var(--card)}
.slot.f{border-style:solid;border-color:var(--lv);color:var(--lv)}
.slot.gap{border:0;background:transparent;width:14px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--sun);color:var(--sun-ink);font-family:var(--f-display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.tile[disabled]{opacity:.25;box-shadow:none}
.mic{width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:var(--bad);color:#fff;font-size:40px;box-shadow:0 4px 0 var(--ink)}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.letters{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:2px;text-align:center}
.letters .g{color:var(--good)} .letters .r{color:var(--bad);text-decoration:underline wavy}
.score{font-family:var(--f-display);font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* flashcard */
.fc{perspective:1200px;width:100%;max-width:440px;margin:0 auto;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:3px solid var(--lv);background:var(--card);box-shadow:0 5px 0 var(--lv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-word{font-family:var(--f-display);font-size:40px;font-weight:800;color:var(--lv);line-height:1.1;overflow-wrap:anywhere}
.fc-vi{font-family:var(--f-display);font-size:30px;font-weight:700}
.fc-em{font-size:84px;line-height:1}
.fc-hint{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.k{background:var(--good);border-color:var(--good)}
.dots i.l{background:var(--sun);border-color:var(--sun)}
.dots i.c{outline:2px solid var(--ink)}
/* chat */
.scene{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.scene .av{font-size:44px;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--soft)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--lv);color:#fff;border-bottom-right-radius:6px}
.msg .en{font-family:var(--f-display);font-size:19px;font-weight:600}
.msg .vi{font-size:13px;color:var(--muted);margin-top:4px}
.msg .fix{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--sun) 25%,transparent)}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{text-align:left;border:2px solid var(--lv);background:var(--card);border-radius:14px;padding:10px 14px;font-family:var(--f-display);font-size:18px;font-weight:600}
.typing{display:flex;gap:8px}
.typing input{flex:1;min-width:0}
/* notebook */
.nb-list{display:flex;flex-direction:column;gap:8px}
.nb{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.nb .em{font-size:30px;text-align:center}
.nb b{font-family:var(--f-display);font-size:18px}
.boxes{display:flex;gap:3px}
.boxes i{width:8px;height:16px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.boxes i.on{background:var(--sun);border-color:var(--sun)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-size:12px;font-weight:600}
.bdg span{display:block;font-size:30px}
.bdg.off{opacity:.35;filter:grayscale(1)}
/* teacher */
label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl{overflow-x:auto}

/* patterns */
.pats{display:flex;flex-direction:column;gap:8px}
.pat{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--soft)}
.pat b{font-family:var(--f-display);font-size:17px;font-weight:600;display:block}
.pat span{font-size:13px;color:var(--muted)}
/* meme */
.meme{--meme-bg:#22302A;--meme-ink:#FFFFFF;background:radial-gradient(circle at 50% 45%,#3A4D44,var(--meme-bg) 70%);border:4px solid #0E1512;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:100%;max-width:340px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.meme .mt,.meme .mb{font-family:var(--f-meme);text-transform:uppercase;color:var(--meme-ink);font-size:24px;line-height:1.1;letter-spacing:.5px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000;text-wrap:balance}
.meme .me{font-size:84px;line-height:1.1}
.meme.big .me{font-size:110px}
.meme-pop{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;width:min(320px,86vw);animation:memein .35s ease-out;cursor:pointer}
@keyframes memein{from{transform:translate(-50%,-20px) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
/* voice chat */
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:18px}
.voice .mic{width:84px;height:84px;font-size:36px}
.ex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ex button{border:1px dashed var(--lv);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.msg.me.bad{background:color-mix(in srgb,var(--bad) 75%,var(--card))}
/* homework */
.hw-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hw-hero .ic{font-size:52px;width:84px;height:84px;display:grid;place-items:center;border-radius:24px;background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 20%,var(--card));color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pill.wait{background:color-mix(in srgb,var(--sun) 30%,var(--card));color:var(--sun-ink)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.qchip.ok{border-color:var(--good);color:var(--good)}
.qchip.no{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.games{display:flex;flex-wrap:wrap;gap:8px}
.games label{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.hwrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hwrow:last-child{border-bottom:0}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover{background:var(--soft)}
.rank{font-family:var(--f-display);font-weight:800}

/* pattern sentences in practice */
.word .ps{color:var(--ink);font-weight:500}
.fc-pat{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:15px;text-align:center}
.fc-pat b{font-family:var(--f-display);font-weight:600}
.fc-pat span{font-size:13px;color:var(--muted)}
.cap-vi{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:6px}
.bline{min-height:60px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border:2px dashed var(--lv);border-radius:14px;background:var(--card)}
.tok{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 12px;font-family:var(--f-display);font-size:18px;font-weight:600;box-shadow:0 2px 0 var(--ink)}

function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function firstVi(v){return String(v||'').split(/[,;/]/)[0].trim()}
function guessPos(w){const l=String(w).toLowerCase().trim();const f=l.split(/\s+/)[0];
  if(/\s/.test(l))return COMMON_V.has(f)?'v':'n';
  if(FUNC_W.has(l))return 'x';if(UNCOUNT.has(l))return 'u';if(COMMON_V.has(l))return 'v';if(COMMON_ADJ.has(l))return 'adj';
  if(/ly$/.test(l)&&l.length>4)return 'adv';if(/(ful|ous|ive|less|able|ible)$/.test(l))return 'adj';return 'n'}
function normPos(p,w){const k=POS_IN[String(p||'').toLowerCase().trim()];const r=k||guessPos(w);return r==='n'&&UNCOUNT.has(String(w).toLowerCase())?'u':r}
function emojiFor(w,pos){const l=String(w).toLowerCase().trim();const d=dictLookup(l);if(d&&d.e&&d.e!=='🔤')return d.e;
  if(EMOJI_KW[l])return EMOJI_KW[l];if(pos==='v'&&EMOJI_KW[l+'_v'])return EMOJI_KW[l+'_v'];
  const sing=l.replace(/(ies)$/,'y').replace(/(es|s)$/,'');if(EMOJI_KW[sing])return EMOJI_KW[sing];
  for(const p of l.split(/\s+/).reverse())if(EMOJI_KW[p])return EMOJI_KW[p];
  return {v:'🏃',adj:'✨',adv:'💬',x:'💬'}[pos]||'📘'}
function autoSents(w,lv,pos){if(typeof RAW!=='undefined'&&RAW[lv]&&RAW[lv].tpl)lv=RAW[lv].tpl;const L=AUTO_TPL[lv]||AUTO_TPL.starters;const t=(L[pos]||L.n).split('\n').map(l=>{const [en,vi]=l.split('|');return {en,vi}});
  const o={w:w.w,vi:firstVi(w.vi)||w.w};const k=hashStr(w.w)%t.length;
  return t.slice(k).concat(t.slice(0,k)).map(p=>({en:fillTpl(p.en,o),vi:capVi(fillTpl(p.vi,o))}))}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))])}
async function netPos(w){try{const r=await withTimeout(fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w)),7000);if(!r.ok)return {};const d=await r.json();
  const e=d&&d[0]||{};const ps=(e.meanings||[]).map(m=>m.partOfSpeech);const m={noun:'n',verb:'v',adjective:'adj',adverb:'adv'};
  const ph=(e.phonetics||[]).map(x=>x.text).filter(Boolean);const ipa=String(ph.find(x=>/ə|ɪ|ʊ|ɒ/.test(x))||e.phonetic||ph[0]||'').replace(/^\/|\/$/g,'').replace(/^\[|\]$/g,'');
  return {pos:m[ps[0]]||'',ipa}}catch(e){return {}}}
async function netVi(w){try{const r=await withTimeout(fetch('https://api.mymemory.translated.net/get?langpair=en|vi&q='+encodeURIComponent(w)),8000);if(!r.ok)return '';const d=await r.json();
  let t=String(d&&d.responseData&&d.responseData.translatedText||'').trim();if(!t||/MYMEMORY|QUERY LENGTH|INVALID/i.test(t)||t.toLowerCase()===w.toLowerCase())return '';
  t=t.replace(/[.!]+$/,'');return t.length>40?'':t.charAt(0).toLowerCase()+t.slice(1)}catch(e){return ''}}
/* Điền những gì còn thiếu cho danh sách từ: nghĩa, loại từ, emoji, câu ví dụ theo trình độ. onStep(i,n) báo tiến độ. */
async function autoComplete(ws,lv,onStep){let net=0,netFail=0,done=0;const out=ws.map(w=>({...w}));
  const job=async w=>{const d=dictLookup(w.w);
    if(d){w.vi=w.vi||d.vi;w.e=w.e||d.e;if(!w.s)w.s=d.s;w.src=w.src||'dict'}
    let pos=w.p?normPos(w.p,w.w):'';
    if(!w.ipa)w.ipa=ipaOf(w.w);
    if((!pos||!w.ipa)&&!/\s/.test(w.w)){const np=await netPos(w.w);if(np.pos&&!pos)pos=np.pos;if(np.ipa&&!w.ipa)w.ipa=np.ipa}
    pos=pos?normPos(pos,w.w):guessPos(w.w);w.p=pos;
    if(!w.vi){const t=await netVi(w.w);if(t){w.vi=t;w.auto=1;net++}else netFail++}
    if(!w.e)w.e=emojiFor(w.w,pos);
    if(!w.s){w.s=autoSents(w,lv,pos)[0].en;w.autoS=1}
    onStep&&onStep(++done,out.length)};
  const q=out.slice();await Promise.all([0,1,2,3].map(async()=>{while(q.length)await job(q.shift())}));
  return {ws:out,net,netFail}}

const GS_CODE="/**\n * YLE Video Words \u2013 n\u01a1i nh\u1eadn b\u00e0i t\u1eadp c\u1ee7a h\u1ecdc sinh.\n * D\u00e1n to\u00e0n b\u1ed9 \u0111o\u1ea1n m\u00e3 n\u00e0y v\u00e0o Google Apps Script c\u1ee7a m\u1ed9t Google Sheet (xem README.md, m\u1ee5c 6).\n *\n * B\u01af\u1edaC B\u1eaeT BU\u1ed8C: \u0111\u1ed5i m\u00e3 b\u00ean d\u01b0\u1edbi th\u00e0nh m\u00e3 c\u1ee7a ri\u00eang b\u1ea1n.\n * \u0110\u00e2y l\u00e0 m\u00e3 gi\u00e1o vi\u00ean nh\u1eadp trong app \u0111\u1ec3 XEM k\u1ebft qu\u1ea3. \u0110\u1eebng chia s\u1ebb m\u00e3 n\u00e0y v\u1edbi h\u1ecdc sinh.\n */\nconst TEACHER_KEY = 'doi-ma-nay-thanh-ma-rieng';\n\nconst SHEET_HW = 'BaiTap';\nconst SHEET_RESULTS = 'KetQua';\nconst SHEET_USERS = 'HocSinh';   // m\u1ed7i m\u00e1y h\u1ecdc sinh m\u1ed9t d\u00f2ng: sao, chu\u1ed7i ng\u00e0y h\u1ecdc, l\u01b0\u1ee3t m\u1edf app\nconst SHEET_VISITS = 'TruyCap';  // m\u1ed7i m\u00e1y m\u1ed7i ng\u00e0y m\u1ed9t d\u00f2ng, \u0111\u1ec3 \u0111\u1ebfm l\u01b0\u1ee3t truy c\u1eadp theo ng\u00e0y\n\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const d = JSON.parse(e.postData.contents);\n    const ss = SpreadsheetApp.getActiveSpreadsheet();\n    if (d.type === 'assign') {\n      sheet_(ss, SHEET_HW, ['T\u1ea1o l\u00fac', 'M\u00e3 b\u00e0i', 'T\u00ean b\u00e0i', 'Tr\u00ecnh \u0111\u1ed9', 'Ch\u1ee7 \u0111\u1ec1', 'S\u1ed1 t\u1eeb', 'C\u00e1c ph\u1ea7n', 'H\u1ea1n n\u1ed9p', 'Link'])\n        .appendRow([new Date(), text_(d.id), text_(d.title), text_(d.lv), text_(d.tp), Number(d.n) || 0, text_(d.g), text_(d.due), text_(d.link, 500)]);\n    } else if (d.type === 'ping') {\n      ping_(ss, d);\n    } else if (d.type === 'attempt') {\n      const items = Array.isArray(d.items) ? d.items.slice(0, 200) : [];\n      const wrong = items.filter(function (x) { return !x.ok; }).map(function (x) { return (x.nles > 1 ? 'B\u00e0i ' + x.les + ' ' : '') + 'c\u00e2u ' + x.n + ': ' + x.w; }).join(', ');\n      sheet_(ss, SHEET_RESULTS, ['Th\u1eddi gian', 'M\u00e3 b\u00e0i', 'M\u00e3 l\u01b0\u1ee3t', 'T\u00ean', 'L\u1edbp', 'Tr\u1ea1ng th\u00e1i', '\u0110\u00fang', 'T\u1ed5ng', 'S\u1ed1 gi\u00e2y', 'C\u00e2u sai', 'Chi ti\u1ebft'])\n        .appendRow([new Date(Number(d.ts) || Date.now()), text_(d.hw), text_(d.sid), text_(d.name, 40), text_(d.cls, 20), d.status === 'done' ? 'done' : 'start',\n          Number(d.score) || 0, Number(d.total) || 0, Number(d.seconds) || 0, text_(wrong, 2000), JSON.stringify(items)]);\n    }\n    return out_({ ok: true });\n  } catch (err) {\n    return out_({ ok: false, error: 'bad_request' });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction doGet(e) {\n  const p = e.parameter || {};\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  // B\u1ea3ng v\u00e0ng: ai c\u0169ng xem \u0111\u01b0\u1ee3c, ch\u1ec9 tr\u1ea3 v\u1ec1 t\u00ean g\u1ecdi v\u00e0 s\u1ed1 sao.\n  if (p.action === 'top') {\n    const all = users_(ss).filter(function (u) { return u.name; }).sort(function (a, b) { return b.stars - a.stars; });\n    let yourRank = 0;\n    all.forEach(function (u, i) { if (p.dev && u.dev === p.dev) yourRank = i + 1; });\n    return out_({ ok: true, yourRank: yourRank, items: all.slice(0, 6).map(function (u) {\n      return { name: String(u.name).slice(0, 20), stars: u.stars, you: !!p.dev && u.dev === p.dev };\n    }) });\n  }\n  if (p.key !== TEACHER_KEY) return out_({ ok: false, error: 'key' });\n  if (p.action === 'list') {\n    const sh = ss.getSheetByName(SHEET_HW);\n    const v = sh ? sh.getDataRange().getValues().slice(1) : [];\n    return out_({ ok: true, items: v.map(function (r) {\n      return { created: +new Date(r[0]), id: String(r[1]), title: r[2], lv: r[3], tp: r[4], n: r[5], g: r[6], due: String(r[7]), link: r[8] };\n    }) });\n  }\n  if (p.action === 'results') {\n    const sh = ss.getSheetByName(SHEET_RESULTS);\n    const v = sh ? sh.getDataRange().getValues().slice(1) : [];\n    return out_({ ok: true, rows: v.filter(function (r) { return String(r[1]) === String(p.hw); }).map(function (r) {\n      return { ts: +new Date(r[0]), hw: String(r[1]), sid: String(r[2]), name: String(r[3]).replace(/^'/, ''), cls: String(r[4]).replace(/^'/, ''),\n        status: r[5], score: r[6], total: r[7], seconds: r[8], items: json_(r[10]) };\n    }) });\n  }\n  if (p.action === 'students') {\n    const daily = {};\n    const vs = ss.getSheetByName(SHEET_VISITS);\n    if (vs) vs.getDataRange().getValues().slice(1).forEach(function (r) { const k = String(r[0]); daily[k] = (daily[k] || 0) + 1; });\n    return out_({ ok: true, daily: daily, students: users_(ss).map(function (u) {\n      return { name: u.name, cls: u.cls, stars: u.stars, streak: u.streak, best: u.best, freeze: u.freeze, first: u.first, last: u.last,\n        lastDay: u.lastDay, streakDay: u.streakDay, opens: u.opens, days: u.days };\n    }) });\n  }\n  return out_({ ok: true });\n}\n\n// Ghi nh\u1eadn m\u1ed9t m\u00e1y h\u1ecdc sinh: c\u1eadp nh\u1eadt sao, chu\u1ed7i ng\u00e0y h\u1ecdc; \u0111\u1ebfm l\u01b0\u1ee3t m\u1edf v\u00e0 s\u1ed1 ng\u00e0y v\u00e0o app.\nfunction ping_(ss, d) {\n  const dev = String(d.dev || '').replace(/[^a-z0-9]/gi, '').slice(0, 24);\n  if (!dev) return;\n  const sh = sheet_(ss, SHEET_USERS, ['M\u00e3 m\u00e1y', 'T\u00ean', 'L\u1edbp', 'Sao', 'Chu\u1ed7i', 'K\u1ef7 l\u1ee5c', '\u0110\u00f3ng b\u0103ng', 'L\u1ea7n \u0111\u1ea7u', 'L\u1ea7n cu\u1ed1i', 'Ng\u00e0y cu\u1ed1i', 'Ng\u00e0y h\u1ecdc cu\u1ed1i', 'S\u1ed1 l\u01b0\u1ee3t m\u1edf', 'S\u1ed1 ng\u00e0y v\u00e0o']);\n  const day = dayNum_(d.day), sday = dayNum_(d.last), now = new Date();\n  const ids = sh.getLastRow() > 1 ? sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues() : [];\n  let row = -1;\n  for (let i = 0; i < ids.length; i++) if (String(ids[i][0]) === dev) { row = i + 2; break; }\n  if (row < 0) {\n    sh.appendRow([dev, text_(d.name, 40), text_(d.cls, 20), Number(d.stars) || 0, Number(d.streak) || 0, Number(d.best) || 0, Number(d.freeze) || 0, now, now, day, sday, d.open ? 1 : 0, 1]);\n    if (day) sheet_(ss, SHEET_VISITS, ['Ng\u00e0y', 'M\u00e3 m\u00e1y']).appendRow([day, dev]);\n    return;\n  }\n  const r = sh.getRange(row, 1, 1, 13).getValues()[0];\n  const newDay = day && Number(r[9]) !== day;\n  sh.getRange(row, 2, 1, 12).setValues([[text_(d.name, 40) || r[1], text_(d.cls, 20), Number(d.stars) || 0, Number(d.streak) || 0,\n    Math.max(Number(d.best) || 0, Number(r[5]) || 0), Number(d.freeze) || 0, r[7], now, day || r[9], sday || r[10],\n    (Number(r[11]) || 0) + (d.open ? 1 : 0), (Number(r[12]) || 0) + (newDay ? 1 : 0)]]);\n  if (newDay) sheet_(ss, SHEET_VISITS, ['Ng\u00e0y', 'M\u00e3 m\u00e1y']).appendRow([day, dev]);\n}\nfunction users_(ss) {\n  const sh = ss.getSheetByName(SHEET_USERS);\n  if (!sh || sh.getLastRow() < 2) return [];\n  return sh.getRange(2, 1, sh.getLastRow() - 1, 13).getValues().map(function (r) {\n    return { dev: String(r[0]), name: String(r[1]).replace(/^'/, ''), cls: String(r[2]).replace(/^'/, ''), stars: Number(r[3]) || 0, streak: Number(r[4]) || 0,\n      best: Number(r[5]) || 0, freeze: Number(r[6]) || 0, first: +new Date(r[7]), last: +new Date(r[8]), lastDay: Number(r[9]) || 0, streakDay: Number(r[10]) || 0,\n      opens: Number(r[11]) || 0, days: Number(r[12]) || 0 };\n  });\n}\n// '2026-11-09' -> 20261109 (l\u01b0u d\u1ea1ng s\u1ed1 \u0111\u1ec3 Google Sheet kh\u00f4ng t\u1ef1 \u0111\u1ed5i th\u00e0nh ng\u00e0y th\u00e1ng)\nfunction dayNum_(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(s || '')); return m ? Number(m[1] + m[2] + m[3]) : 0; }\n\nfunction sheet_(ss, name, head) {\n  let sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(head); sh.setFrozenRows(1); }\n  return sh;\n}\n// C\u1eaft \u0111\u1ed9 d\u00e0i v\u00e0 ch\u1eb7n ch\u1eef b\u1eaft \u0111\u1ea7u b\u1eb1ng = + - @ \u0111\u1ec3 Google Sheet kh\u00f4ng hi\u1ec3u nh\u1ea7m th\u00e0nh c\u00f4ng th\u1ee9c.\nfunction text_(s, max) {\n  s = String(s == null ? '' : s).slice(0, max || 100);\n  return /^[=+\\-@]/.test(s) ? \"'\" + s : s;\n}\nfunction json_(s) { try { return JSON.parse(s); } catch (e) { return []; } }\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
const stripEmoji=t=>String(t).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍⃣]/gu,'').replace(/\s+/g,' ').trim();
const FEMALE=/female|woman|samantha|karen|serena|kate|libby|sonia|susan|hazel|zira|jenny|aria|ava|allison|victoria|moira|tessa|fiona|emma|amy|joanna|salli|kimberly|google uk english female|google us english/i;
function pickVoice(){const en=VOICES.filter(v=>/^en/i.test(v.lang));return en.find(v=>/en-GB/i.test(v.lang)&&FEMALE.test(v.name))||en.find(v=>FEMALE.test(v.name))||en.find(v=>/en-GB/i.test(v.lang))||en[0]||null}
function utter(text,rate){const u=new SpeechSynthesisUtterance(stripEmoji(text));const v=pickVoice();u.pitch=1.1;if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=rate;return u}
/* Chống mất âm đầu: nhiều điện thoại (nhất là Android, tai nghe Bluetooth) tắt đường loa khi im lặng, nên chữ đầu bị nuốt.
   Trước khi đọc: đánh thức loa bằng một đoạn âm thanh im lặng, chờ một chút nếu loa vừa nghỉ hoặc vừa ngắt câu trước. */
let ACX=null,LAST_TTS=0,TTS_T=0;
function wakeAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ACX=ACX||new AC();if(ACX.state==='suspended')ACX.resume();const b=ACX.createBuffer(1,Math.floor(ACX.sampleRate*0.6),ACX.sampleRate);const src=ACX.createBufferSource();src.buffer=b;src.connect(ACX.destination);src.start()}catch(e){}}
document.addEventListener('pointerdown',()=>{wakeAudio();try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true,capture:true});
function stopSpeak(){clearTimeout(TTS_T);try{speechSynthesis.cancel()}catch(e){}}
function ttsRun(list,rate,onErr){clearTimeout(TTS_T);let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;speechSynthesis.cancel()}catch(e){}
  const idle=Date.now()-LAST_TTS>1200;wakeAudio();const go=()=>{try{list.forEach((t,i)=>{const u=utter(t,rate);u.onstart=()=>{LAST_TTS=Date.now()};u.onend=()=>{LAST_TTS=Date.now()};speechSynthesis.speak(u)});LAST_TTS=Date.now()}catch(e){onErr&&onErr()}};
  const d=(busy?200:0)+(idle?250:60);TTS_T=setTimeout(go,d)}
function speak(text,rate=.85){ttsRun([text],rate,()=>toast('Thiết bị này chưa đọc to được'))}
function speakSeq(texts,rate=.85){ttsRun(texts.filter(Boolean),rate)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let IN_FRAME=true;try{IN_FRAME=window.self!==window.top}catch(e){IN_FRAME=true}
let micBlocked=IN_FRAME;
const voiceOK=()=>!!SR&&!micBlocked;
/* Nghe giọng nói: nghe đến khi bé ngừng nói (không cắt quá sớm), hiện chữ đang nghe được, gom nhiều phương án */
let LISTEN_CB=t=>{if(!t)return;const el=document.querySelector('#sp-hint,#y-hint,#sh-hint,#chat-live');if(el)el.textContent='🎧 '+t};
function listenOnce(onInterim){onInterim=onInterim||LISTEN_CB;return new Promise((res,rej)=>{if(!SR||micBlocked)return rej('unsupported');let r;try{r=new SR()}catch(e){return rej('unsupported')}
  r.lang='en-US';r.interimResults=true;r.maxAlternatives=5;r.continuous=true;
  const finals=[];let interim='',done=false,silT=0,hardT=0,heard=false;
  const finish=()=>{if(done)return;done=true;clearTimeout(silT);clearTimeout(hardT);try{r.stop()}catch(e){}
    const alts=[];if(finals.length){const firsts=finals.map(f=>f[0]).join(' ').trim();alts.push(firsts);finals.forEach(f=>f.forEach(a=>alts.push(a.trim())))}if(interim.trim())alts.push(interim.trim());
    const u=[...new Set(alts.filter(Boolean))];u.length?res(u):rej('no-speech')};
  const quiet=ms=>{clearTimeout(silT);silT=setTimeout(finish,ms)};
  r.onresult=e=>{heard=true;interim='';for(let i=e.resultIndex;i<e.results.length;i++){const R=e.results[i];if(R.isFinal)finals.push([...R].map(a=>a.transcript));else interim+=R[0].transcript}
    try{onInterim&&onInterim((finals.map(f=>f[0]).join(' ')+' '+interim).trim())}catch(x){}
    quiet(finals.length&&!interim?900:1600)};
  r.onspeechend=()=>quiet(700);
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micBlocked=true;done=true;return rej(e.error)}if(e.error==='no-speech'&&!heard){done=true;return rej('no-speech')}if(e.error==='aborted')return;if(!heard){done=true;rej(e.error)}else finish()};
  r.onend=()=>{if(!done){if(heard)finish();else{done=true;rej('no-speech')}}};

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){n=+n;if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');if(n===100)return 'one hundred';return String(n)}
const norm=s=>String(s).toLowerCase().replace(/[-–]/g,' ').replace(/\b(\d{1,3})\b/g,(m,d)=>+d<=100?numWords(d):m).replace(/[^a-z0-9' ]/g,'').replace(/'/g,'').replace(/\s+/g,' ').trim();
function phon(x){return x.replace(/ph/g,'f').replace(/ck|c(?=[aou])|q/g,'k').replace(/c/g,'s').replace(/z/g,'s').replace(/th/g,'t').replace(/sh/g,'s').replace(/wh/g,'w').replace(/kn/g,'n').replace(/gh/g,'').replace(/(.)\1+/g,'$1').replace(/ee|ea/g,'i').replace(/oo/g,'u').replace(/e$/,'').replace(/s$/,'')}
function scoreSpeech(target,alts){const r1=scoreSpeech0(target,alts);if(r1.sc>=90)return r1;const pt=phon(norm(target).replace(/ /g,''));let best=r1;
  for(const a of alts){const toks=norm(a).split(' ').filter(Boolean);const n=Math.max(1,norm(target).split(' ').length);for(let i=0;i<toks.length;i++)for(const k of [n,n+1,Math.max(1,n-1)]){const cand=toks.slice(i,i+k).join('');if(!cand)continue;const pc=phon(cand);const sc=Math.round((1-lev(pt,pc)/Math.max(pt.length,pc.length,1))*100)-8;if(sc>best.sc)best={sc,heard:a,tok:cand}}}
  return best}
function scoreSpeech0(target,alts){const t=norm(target).replace(/ /g,'');let best={sc:0,heard:alts[0]||'',tok:''};for(const a of alts){const toks=norm(a).split(' ').filter(Boolean);const n=norm(target).split(' ').length;for(let i=0;i<toks.length;i++){const cand=toks.slice(i,i+n).join('');const sc=Math.round((1-lev(t,cand)/Math.max(t.length,cand.length))*100);if(sc>best.sc)best={sc,heard:a,tok:cand}}}return best}
function letterMarks(target,heard){const a=target.toLowerCase(),b=heard;const m=a.length,n=b.length;const L=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);const ok=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}return [...target].map((ch,k)=>ch===' '||ch==='-'?ch:`<span class="${ok[k]?'g':'r'}">${esc(ch)}</span>`).join('')}
function matchAnswer(alts,ans){let best={sc:0,heard:alts[0]||''};for(const h of alts){const hn=norm(h);for(const a of ans){let sc;if(a.startsWith('~')){const p=norm(a.slice(1));sc=hn.startsWith(p)?100:Math.round((1-lev(p,hn.slice(0,p.length))/Math.max(p.length,1))*100)}else{const an=norm(a);sc=Math.round((1-lev(an,hn)/Math.max(an.length,hn.length,1))*100)}if(sc>best.sc)best={sc,heard:h}}}return best}

function gWrite(){

  let filled=[];let tries=0,done=false;
  const draw=()=>{let fi=0;
    $('#slots').innerHTML=target.map(c=>isL(c)?`<span class="slot ${filled[fi]?'f':''}">${filled[fi++]?.c||''}</span>`:`<span class="slot gap">${c===' '?'':esc(c)}</span>`).join('');
    $('#tiles').innerHTML=letters.map((x,k)=>`<button class="tile" data-t="${k}" ${filled.includes(x)?'disabled':''}>${esc(x.c)}</button>`).join('');
    document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(done)return;filled.push(letters[+b.dataset.t]);draw();check()});
  };
  const check=()=>{if(filled.length<need.length)return;
    if(filled.map(x=>x.c).join('')===need.join('')){done=true;sRecord('write',w,tries===0);speak(w.w);$('#after').innerHTML=`<div class="card row" style="justify-content:space-between"><b>Đúng rồi: ${esc(w.w)}</b><button class="btn sun" id="nx">${SESSION.i+1<SESSION.words.length?'Tiếp →':'Xem kết quả →'}</button></div>`;$('#nx').onclick=sNext}
    else{tries++;sWrongFx();toast('Chưa đúng, thử lại nhé!');setTimeout(()=>{filled=[];draw()},500)}};
  $('#game').innerHTML=`<h2>Xếp chữ thành từ ${qNo()}</h2>
    <div class="card stack" style="align-items:center;gap:6px"><div class="prompt-em">${w.e}</div><span>${esc(w.vi)}</span><button class="btn sm" id="w-say">🔊 Nghe từ</button></div>
    <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
    <div class="row" style="justify-content:center"><button class="btn sm ghost" id="w-undo">⌫ Xóa chữ</button><button class="btn sm ghost" id="w-hint">💡 Gợi ý</button><button class="btn sm ghost" id="w-skip">⏭ Bỏ qua</button></div><div id="after"></div>`;

  draw();
}

async function chatMic(){

const MAX_MORE=2;

function chatCheckpoint(){if((CHAT.rounds||0)>=MAX_MORE){CHAT.msgs.push({role:'ai',en:'Thank you for talking with me! Goodbye!',vi:'Cảm ơn con đã trò chuyện với cô! Tạm biệt!'});chatCredit();CHAT.checkpoint=false;CHAT.done=true;return}

const REACT_FREE=[['I see!','Cô hiểu rồi!'],['Oh, really? Nice!','Ồ, thật à? Hay đấy!'],['Thank you for telling me!','Cảm ơn con đã kể cho cô!'],["Oh, that's interesting!",'Ồ, thú vị ghê!']];

function aiPrompt(){
  const L=lvOf(CHAT.lv),T=topicOf(CHAT.lv,CHAT.tp);const turns=CHAT.msgs.filter(m=>m.role==='me').length;
  return `You are ${NAME}, a kind and cheerful English teacher, playing a short role-play with a Vietnamese child aged 6-11 who is learning English at Cambridge YLE ${L.name} level (CEFR ${L.cefr}).
Topic: ${T.name} (${T.vi}). Target words: ${T.words.map(w=>w.w).join(', ')}.
Target sentence patterns: ${T.pats.map(p=>p.en).join(' / ')}.
Pick one simple real-life situation for this topic and keep it for the whole talk.
Rules:
- Use only very simple English for ${L.name}: 1-2 short sentences, at most 10 words each. React to the content of what the child said and add one small detail that moves the story forward (never just "Great!" or "Interesting!" on its own), then ask ONE simple follow-up question that invites them to use a target pattern.
- The child may answer freely. Do NOT correct the child during the talk and never say their answer is wrong. Just reply naturally and keep the conversation going.
- If the child's last message has a mistake or could be said more fully, put a better simple version in "correction" (it is shown to the child only at the end). Otherwise leave it empty.
- Never ask for or repeat personal information (real name, age, address, school, phone, photos). If the child gives some, don't repeat it and move on.
- If the child goes off topic or writes something unkind or unsafe, gently bring the talk back to the situation.
- The child has answered ${turns} times. When the child has answered ${CHAT.aiLimit||6} times, wrap up this part of the topic warmly in one short sentence, ask no question, and set "done" to true.
${CHAT.contNote?'- The child chose to keep talking. Start a new small part of the same situation and ask a new question.':''}
- "suggestions": 3 short example answers the child could give, correct English at ${L.name} level, different meanings, at most 8 words.
${turns===0?'This is the start: greet the child and set the scene. Also fill "scene_vi" with one short Vietnamese sentence describing the situation.':''}
Conversation so far:
${CHAT.msgs.map(m=>(m.role==='ai'?NAME+': ':'Child: ')+m.en).join('\n')||'(none)'}
Reply with JSON only: {"reply":"...","reply_vi":"natural Vietnamese translation","correction":"","suggestions":["...","...","..."],"scene_vi":"","done":false}`;
}
async function aiMore(){CHAT.rounds=(CHAT.rounds||0)+1;CHAT.aiLimit=(CHAT.aiLimit||6)+6;CHAT.checkpoint=false;CHAT.contNote=true;CHAT.busy=true;vChat();await aiTurn();CHAT.contNote=false}
async function aiStart(){CHAT.rounds=0;CHAT.aiLimit=6;CHAT.checkpoint=false;CHAT.credited=false;CHAT.contNote=false;CHAT.mode='ai';CHAT.msgs=[{role:'ai',en:'Hi! Let\'s talk!',vi:'Chào con! Cùng nói chuyện nhé!'}];CHAT.done=false;CHAT.sugs=[];CHAT.hint=false;CHAT.busy=true;CHAT.scene='';vChat();await aiTurn()}
async function aiSend(text){if(CHAT.busy||CHAT.done||!text)return;CHAT.msgs.push({role:'me',en:text});CHAT.busy=true;CHAT.sugs=[];CHAT.hint=false;vChat();await aiTurn()}
async function aiTurn(){
  try{const out=await SAMPLE.json(aiPrompt(),{modelTier:'quick',cache:false});
    if(out.scene_vi)CHAT.scene=out.scene_vi;
    const lastMe=[...CHAT.msgs].reverse().find(m=>m.role==='me');if(lastMe&&out.correction&&norm(out.correction)!==norm(lastMe.en))lastMe.fix=String(out.correction);
    CHAT.msgs.push({role:'ai',en:String(out.reply||''),vi:String(out.reply_vi||'')});
    CHAT.sugs=Array.isArray(out.suggestions)?out.suggestions.slice(0,3).map(String):[];
    if(lastMe)addStars(1);
    if(out.done)chatCheckpoint();
    CHAT.busy=false;vChat();speak(CHAT.msgs[CHAT.msgs.length-1].en);
  }catch(e){CHAT.busy=false;
    if(e&&(e.code==='not_granted'||e.code==='unavailable')){SAMPLE=null;toast('AI chưa được bật, chuyển sang luyện hội thoại theo chủ đề');return dlgStart()}
    const last=CHAT.msgs[CHAT.msgs.length-1];if(last&&last.role==='me'){CHAT.msgs.pop();CHAT.sugs=[last.en]}
    toast(e&&e.code==='rate_limited'?NAME+' đang bận, đợi một chút rồi thử lại nhé':NAME+' chưa trả lời được, con gửi lại câu trả lời nhé');vChat()}
}

function libParseWords(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [w,vi,e,s,p,ipa]=l.split('|').map(x=>(x||'').trim());return {w,vi,e,s,p:POS_IN[(p||'').toLowerCase()]||'',ipa:(ipa||'').replace(/^\/|\/$/g,'')}}).filter(x=>x.w)}
function libLine(w){const i=w.ipa||ipaOf(w.w);return [w.w,w.vi||'',w.e||'',w.s||'',w.p?POS_LABEL[w.p]:'',i?'/'+i+'/':''].join(' | ').replace(/( \| )+$/,'')}
function libParsePats(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [en,vi]=l.split('|').map(x=>(x||'').trim());return {en,vi}}).filter(x=>x.en)}
function libAutoFill(ws){return ws.map(w=>{const d=dictLookup(w.w);return {w:w.w,p:w.p,vi:w.vi||(d?d.vi:''),e:w.e||(d?d.e:''),s:w.s||(d?d.s:''),src:d?'dict':''}})}

    <p class="muted" id="ve-len" style="margin:0;font-size:13px"></p>
    <div><label for="ve-tr">Lời thoại</label><textarea id="ve-tr" style="min-height:150px" placeholder="Mỗi dòng một câu. Có thể dán nguyên bản chép lời của YouTube (có cả mốc thời gian), ví dụ:&#10;0:05&#10;Hello! I'm Ben.&#10;0:08&#10;This is my dog.">${esc(V.lines.map(l=>(typeof l.s==='number'?fmtSec(l.s)+' ':'')+l.t).join('\n'))}</textarea>
      <p class="muted" style="margin:4px 0 0;font-size:13px">Trên YouTube: bấm <b>…Thêm</b> dưới video → <b>Hiện bản chép lời</b> → bôi đen và sao chép. App tự lấy mốc thời gian và chỉ giữ các câu nằm trong đoạn đã chọn. Nên sửa lại cho đúng chính tả và bỏ câu quá dài.<br><b>Không bắt buộc:</b> để trống thì học sinh luyện theo phụ đề tiếng Anh của YouTube (tự chấm), có lời thoại thì app chấm điểm từng câu.</p></div>
    <div class="row"><button class="btn" id="ve-parse" type="button">📋 Xử lý lời thoại</button><button class="btn" id="ve-sync" type="button">⏱ Đồng bộ thời gian bằng tay</button></div>
    <div id="ve-lines"></div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input type="checkbox" id="ve-ok" ${V.checked?'checked':''} style="margin-top:3px"> Tôi đã xem hết đoạn video này và thấy nội dung, quảng cáo, lời nói đều phù hợp với học sinh tiểu học.</label>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="ve-pub" ${V.pub?'checked':''}> Hiện trong tab 🎬 Video của học sinh (khi tải content.json lên GitHub)</label>
    <div class="row"><button class="btn sun" id="ve-save">💾 Lưu video</button></div></div>`;
  const lvSet=()=>document.querySelectorAll('[data-vlv]').forEach(b=>b.onclick=()=>{V.lv=b.dataset.vlv;document.querySelectorAll('[data-vlv]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.vlv===V.lv))});lvSet();
  const lenNote=()=>{const a=parseSec($('#ve-a').value),b=parseSec($('#ve-b').value);const d=(b??0)-(a??0);$('#ve-len').innerHTML=a==null||b==null||d<=0?'<span style="color:var(--bad)">Mốc thời gian chưa đúng (ví dụ 0:15 và 1:20).</span>':`Độ dài đoạn: <b>${fmtSec(d)}</b>${d>120?' · <span style="color:var(--bad)">hơi dài, nên chọn khoảng 1 phút</span>':d<20?' · hơi ngắn':''}`};
  $('#ve-a').oninput=$('#ve-b').oninput=lenNote;lenNote();
  const readBounds=()=>{V.start=parseSec($('#ve-a').value)??0;V.end=parseSec($('#ve-b').value)??V.start+60};
  const drawLines=()=>{const el=$('#ve-lines');if(!V.lines.length){el.innerHTML='';return}const sync=vSynced(V);
    el.innerHTML=`<div class="stack" style="gap:6px"><b>${V.lines.length} câu · ${sync?'<span style="color:var(--good)">đã có mốc thời gian</span>':'<span style="color:var(--bad)">còn câu chưa có mốc thời gian</span>'}</b><div class="tbl"><table class="t"><tr><th>Bắt đầu</th><th>Câu</th><th></th></tr>${V.lines.map((l,i)=>`<tr><td><input type="text" data-ls="${i}" value="${typeof l.s==='number'?fmtSec(l.s):''}" style="width:72px;padding:6px"></td><td><input type="text" data-lt="${i}" value="${esc(l.t)}" style="padding:6px"></td><td><button class="btn sm ghost" type="button" data-lp="${i}" ${typeof l.s==='number'?'':'disabled'}>▶</button></td></tr>`).join('')}</table></div></div>`;
    el.querySelectorAll('[data-ls]').forEach(i=>i.onchange=()=>{const v=parseSec(i.value);V.lines[+i.dataset.ls].s=v;drawLines()});
    el.querySelectorAll('[data-lt]').forEach(i=>i.onchange=()=>{V.lines[+i.dataset.lt].t=i.value.trim()});
    el.querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>{readBounds();const i=+b.dataset.lp;segPlay(V.lines[i].s,lineEnd(V,i),1)})};

    if(timed)ls=ls.filter(l=>typeof l.s!=='number'||(l.s>=V.start-0.5&&l.s<V.end));V.lines=ls.sort((a,b)=>(a.s??1e9)-(b.s??1e9));drawLines();

  const load=()=>{const id=ytId($('#ve-url').value);if(!id)return toast('Link YouTube chưa đúng');V.yt=id;const st=ytStart($('#ve-url').value);if(st&&!ed){$('#ve-a').value=fmtSec(st);$('#ve-b').value=fmtSec(st+60);lenNote()}readBounds();

  $('#ve-load').onclick=load;if(V.yt)setTimeout(load,50);

  $('#ve-sync').onclick=()=>{readBounds();if(!V.lines.length)parse();if(!V.lines.length)return;if(!YTP)return toast('Bấm ▶ Tải video trước');

    const show=()=>{$('#sy-line').textContent=V.lines[k]?`Câu ${k+1}/${V.lines.length}: ${V.lines[k].t}`:'Xong!'};show();
    try{YTP.setPlaybackRate(1);YTP.seekTo(V.start,true);YTP.playVideo()}catch(e){}
    $('#sy-mark').onclick=()=>{if(!V.lines[k])return;V.lines[k].s=Math.round(ytTime()*10)/10;k++;show();if(k>=V.lines.length){try{YTP.pauseVideo()}catch(e){}toast('Đã đồng bộ xong. Bấm ▶ cạnh từng câu để kiểm tra.');drawLines()}};
    $('#sy-stop').onclick=()=>{try{YTP.pauseVideo()}catch(e){}drawLines()}};
  $('#ve-back').onclick=()=>go({vedit:null});
  $('#ve-save').onclick=()=>{readBounds();V.title=$('#ve-title').value.trim();V.checked=$('#ve-ok').checked;V.pub=$('#ve-pub').checked;
    if(!V.yt){const id=ytId($('#ve-url').value);if(id)V.yt=id}
    if(!V.yt)return toast('Dán link YouTube và bấm ▶ Tải video');if(!V.title)return toast('Nhập tên video');if(!(V.end>V.start))return toast('Mốc thời gian chưa đúng');
    if(!V.lines.length&&$('#ve-tr').value.trim())parse();
    if(!V.checked)return toast('Bạn cần xem hết video và đánh dấu ô kiểm duyệt trước khi lưu');
    C.vlib=C.vlib||{};C.vlib[V.id]={...V,parts:false,updated:Date.now()};saveC();toast(vSynced(V)?'Đã lưu video':!V.lines.length?'Đã lưu. Học sinh sẽ luyện theo phụ đề YouTube.':'Đã lưu. Nhớ đồng bộ thời gian để học sinh dùng được Nhại theo và Chép chính tả.');go({vedit:null})};
}

function mmdd(d){d=d||new Date();return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function activeEvents(){const t=mmdd();return EVENTS.filter(ev=>ev.from<=ev.to?(t>=ev.from&&t<=ev.to):(t>=ev.from||t<=ev.to))}
function allItems(){const ev=EVENTS.flatMap(e=>e.items.map(i=>({...i,ev:e.id})));return SHOP.concat(ev)}
function itemById(id){return allItems().find(i=>i.id===id)}
function wallet(){return Math.max(0,(P.stars||0)-(P.spent||0))}
function bestStreak(){const s=P.streak||{};return Math.max(s.best||0,s.n||0)}
function owned(id){return (P.owned||[]).includes(id)}
function petStageHTML(petEmoji,big){const w=P.wear||{};const sc=w.scene&&itemById(w.scene);const it=k=>w[k]&&itemById(w[k])?itemById(w[k]).e:'';

  return `<div class="petstage${big?' big':''}${facey?' facey':''}" style="${sc?`background:${sc.bg}`:''}">${sc?sc.deco.map((d,i)=>`<i class="deco d${i}">${d}</i>`).join(''):''}<span class="pbody">${petEmoji}</span>${it('head')?`<i class="acc head">${it('head')}</i>`:''}${it('face')?`<i class="acc face">${it('face')}</i>`:''}${it('neck')?`<i class="acc neck">${it('neck')}</i>`:''}${it('hand')?`<i class="acc hand">${it('hand')}</i>`:''}</div>`}
function petCaption(name){const w=P.wear||{};const g=k=>w[k]&&itemById(w[k]);const h=g('hand'),sc=g('scene'),hd=g('head'),nk=g('neck');
  const act=(h&&h.say)||(hd&&hd.say)||(nk&&nk.say)||(sc&&sc.say);if(!act)return '';
  const where=sc&&sc.where&&act!==sc.say?' '+sc.where:'';return `${name} đang ${act}${where}!`}
function petPhoto(i){const {cur}=petOf(P.stars);const cap=petCaption(cur[2]);const d=document.createElement('div');d.className='petphoto';d.setAttribute('role','dialog');

let SHOP_TAB='head';
function vShop(){const {cur}=petOf(P.stars);const evs=activeEvents();const evItems=evs.flatMap(e=>e.items.map(i=>({...i,ev:e.id,evn:e.n})));
  const list=(SHOP_TAB==='event'?evItems:SHOP.filter(i=>i.s===SHOP_TAB));const w=P.wear||{};
  $('#view').innerHTML=`<section class="stack">
   <div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="sh-back">← Trang chủ</button><span class="chip" title="Ví sao">👛 ${wallet()} ⭐</span></div>
   <h1>🛍️ Cửa hàng thú cưng</h1>
   <div class="card stack" style="align-items:center;gap:8px">${petStageHTML(cur[1],true)}<b>${esc(cur[2])}</b>${petCaption(cur[2])?`<span class="petcap">📸 ${esc(petCaption(cur[2]))}</span>`:''}<span class="muted" style="font-size:13px;text-align:center">Mua đồ bằng ⭐ trong ví. Tiêu sao <b>không</b> làm thú cưng nhỏ lại và <b>không</b> giảm hạng trên Bảng vàng. Đồ có 🔥 được mở khi con giữ chuỗi ngày học.</span></div>
   ${evs.length?`<div class="note" style="margin:0">${evs.map(e=>`${e.e} <b>${esc(e.n)}</b>: ${esc(e.msg)}`).join('<br>')}</div>`:''}
   <div class="seg" role="group" aria-label="Loại đồ">${(evs.length?[['event','🎉 Sự kiện']]:[]).concat(SHOP_SLOTS).map(([k,l])=>`<button data-st="${k}" aria-pressed="${SHOP_TAB===k}">${l}</button>`).join('')}</div>
   <div class="shopgrid">${list.map(i=>{const own=owned(i.id),on=w[i.s]===i.id,need=i.streak&&bestStreak()<i.streak,poor=!own&&wallet()<i.p;
     return `<div class="shopitem ${on?'on':''}"><span class="si-e">${i.e}</span><b>${esc(i.n)}</b>
       <span class="muted" style="font-size:12px">${i.streak?`🔥 Chuỗi ${i.streak} ngày${i.p?' · ':''}`:''}${i.p?`${i.p} ⭐`:i.streak?'':'Miễn phí'}${i.ev?' · có hạn':''}</span>
       ${own?`<button class="btn sm ${on?'':'pri'}" data-wear="${i.id}">${on?'✓ Đang dùng':'Dùng'}</button>`:need?`<button class="btn sm" disabled>🔒 Cần chuỗi ${i.streak} ngày</button>`:`<button class="btn sm sun" data-buy="${i.id}" ${poor?'disabled':''}>${poor?`Thiếu ${i.p-wallet()} ⭐`:i.p?`Mua ${i.p} ⭐`:'Nhận quà'}</button>`}</div>`}).join('')||'<p class="muted">Chưa có món nào.</p>'}</div>
  </section>`;
  if(!SHOP_SLOTS.some(([k])=>k===SHOP_TAB)&&!(SHOP_TAB==='event'&&evs.length))SHOP_TAB='head';
  $('#sh-back').onclick=()=>go({tab:'home',shop:false});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{SHOP_TAB=b.dataset.st;vShop()});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=itemById(b.dataset.buy);if(!i||owned(i.id))return;if(i.streak&&bestStreak()<i.streak)return;if(wallet()<i.p)return toast('Chưa đủ sao, con học thêm nhé!');
    P.spent=(P.spent||0)+i.p;P.owned=(P.owned||[]).concat(i.id);P.wear=Object.assign({},P.wear,{[i.s]:i.id});saveP();confetti();vShop();petPhoto(i)});
  document.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const i=itemById(b.dataset.wear);const W=Object.assign({},P.wear);W[i.s]=W[i.s]===i.id?null:i.id;P.wear=W;saveP();vShop()});
}

/* ===================== BOOT ===================== */
render();
if(me().name)ping(true);
getSample().then(s=>{if(s&&route.tab==='chat'&&!CHAT.msgs.length)vChat()});
flushOutbox();
if(location.protocol.startsWith('http')&&!IN_FRAME){fetch('content.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.topics){SHARED={topics:Object.assign(emptyTopics(),d.topics),extra:d.extra||{},videos:d.videos||{},vids:Array.isArray(d.vids)?d.vids:[],vhide:Array.isArray(d.vhide)?d.vhide:[]};buildData()}}).catch(()=>{}).finally(()=>{if(!SESSION&&(route.tab!=='chat'||!CHAT.msgs.length)&&!(route.tab==='video'&&route.vid)&&!(route.tab==='teacher'&&route.tview==='video'))render()})}

</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
<script>
setTimeout(function(){var v=document.getElementById('view');if(v&&!v.innerHTML.replace(/\s/g,'')){v.innerHTML='<div style="margin:16px;padding:16px;border-radius:16px;background:#fff8e1;color:#3a2a00;font:16px/1.5 sans-serif"><b>App chưa mở được trên trình duyệt này.</b><br>1. Tải lại trang (kéo xuống hoặc bấm ⟳).<br>2. Cập nhật iPhone/iPad lên bản iOS mới (Cài đặt → Cài đặt chung → Cập nhật phần mềm), hoặc mở link bằng Chrome.<br>3. Vẫn không được thì nhắn cô kèm ảnh chụp màn hình nhé.</div>'}},5000);
</script>
</body>
